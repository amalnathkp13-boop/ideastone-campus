# Single entry point. Hostnames map to services; add them to /etc/hosts for local use:
#   127.0.0.1 campus.local lms.campus.local sso.campus.local
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream odoo      { server odoo:8069; }
upstream odoochat  { server odoo:8072; }
upstream openolat  { server openolat:8088; }
upstream keycloak  { server keycloak:8080; }

server {
    listen 80 default_server;
    server_name campus.local localhost;
    client_max_body_size 200M;
    proxy_read_timeout 720s; proxy_connect_timeout 720s; proxy_send_timeout 720s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location /websocket { proxy_pass http://odoochat; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
    location / { proxy_pass http://odoo; proxy_redirect off; }
    location ~* /web/static/ { proxy_cache_valid 200 90m; proxy_buffering on; expires 864000; proxy_pass http://odoo; }
}

server {
    listen 80;
    server_name lms.campus.local;
    client_max_body_size 500M;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location / { proxy_pass http://openolat; }
}

server {
    listen 80;
    server_name sso.campus.local;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    location / { proxy_pass http://keycloak; }
}
