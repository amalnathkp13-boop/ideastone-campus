# Ideastone Campus — single entry point, single domain.
#   /        → ERP (Odoo + OpenEduCat + Ideastone)
#   /lms/    → OpenOlat LMS   (served with context path /lms, embedded inside the ERP UI)
#   /sso/    → Keycloak       (single sign-on for both)
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream odoo      { server odoo:8069; }
upstream odoochat  { server odoo:8072; }
upstream openolat  { server openolat:8088; }
upstream keycloak  { server keycloak:8080; }

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 500M;
    proxy_read_timeout 720s; proxy_connect_timeout 720s; proxy_send_timeout 720s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Real-IP $remote_addr;

    # ---- LMS (OpenOlat) — allow it to be framed by the ERP on the same origin
    location /lms/ {
        proxy_pass http://openolat/lms/;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        proxy_cookie_path /lms /lms;
    }
    location = /lms { return 301 /lms/; }

    # ---- SSO (Keycloak)
    location /sso/ {
        proxy_pass http://keycloak/sso/;
    }

    # ---- ERP (Odoo)
    location /websocket {
        proxy_pass http://odoochat;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
    location ~* /web/static/ {
        proxy_cache_valid 200 90m; proxy_buffering on; expires 864000;
        proxy_pass http://odoo;
    }
    location / {
        proxy_pass http://odoo;
        proxy_redirect off;
    }
}
