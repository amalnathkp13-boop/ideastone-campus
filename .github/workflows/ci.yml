name: CI

# Runs automatically — nobody has to start it:
#   * every pull request (opened, new commits pushed, reopened)
#   * every push to main (i.e. after each merge)
#   * every night at 02:00 IST, also against the newest upstream OpenEduCat 17.0
#   * manually from the Actions tab ("Run workflow") when needed
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC = 02:00 IST
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run that is still going for the old commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install ruff
      - name: Ruff
        run: ruff check addons/ scripts/ --output-format=github
      - name: Validate XML
        run: python -c "import glob,xml.etree.ElementTree as E; [E.parse(f) for f in glob.glob('addons/**/*.xml', recursive=True)]; print('xml ok')"
      - name: Validate shell scripts
        run: for f in odoo/*.sh openolat/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: Validate compose file
        run: docker compose config -q

  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      db:
        image: postgres:16
        env: { POSTGRES_USER: odoo, POSTGRES_PASSWORD: odoo, POSTGRES_DB: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U odoo" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Use newest upstream OpenEduCat (nightly only)
        if: github.event_name == 'schedule'
        run: |
          git -C vendor/openeducat_erp fetch --depth 1 origin 17.0
          git -C vendor/openeducat_erp checkout -q FETCH_HEAD
          echo "Testing against OpenEduCat $(git -C vendor/openeducat_erp rev-parse --short HEAD)"
      - name: Install all campus modules and run tests on Odoo 17
        shell: bash
        run: |
          docker volume create faculty-ci-data
          docker run --rm --network host --entrypoint odoo \
            -v faculty-ci-data:/var/lib/odoo \
            -v "$PWD/addons:/mnt/ideastone-addons:ro" \
            -v "$PWD/vendor/openeducat_erp:/mnt/openeducat:ro" \
            odoo:17.0 \
            --db_host=127.0.0.1 --db_user=odoo --db_password=odoo -d ci \
                 --addons-path=/mnt/ideastone-addons,/mnt/openeducat,/usr/lib/python3/dist-packages/odoo/addons \
                 -i ideastone_campus,ideastone_lms,ideastone_erp --test-enable --test-tags=/ideastone_erp \
                 --stop-after-init --workers=0 --max-cron-threads=0 --log-level=test 2>&1 | tee install.log
          ! grep -E "^[0-9-]+ [0-9:,]+ [0-9]+ (ERROR|CRITICAL)" install.log
      - name: Test summary
        if: always()
        run: |
          {
            echo "### Odoo install & tests"
            grep -E "odoo.tests.result|odoo.tests.stats" install.log | sed 's/^.*INFO [^ ]* //' || echo "no test summary found"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Faculty UI on disposable Odoo
        shell: bash
        run: |
          set -euo pipefail
          export FACULTY_QA_PASSWORD=$(openssl rand -hex 20)
          export FACULTY_QA_OUT="$RUNNER_TEMP/faculty-ui-proof"
          mkdir -p "$FACULTY_QA_OUT"
          mounts=(-v faculty-ci-data:/var/lib/odoo -v "$PWD/addons:/mnt/ideastone-addons:ro" -v "$PWD/vendor/openeducat_erp:/mnt/openeducat:ro")
          odoo_args=(--db_host=127.0.0.1 --db_user=odoo --db_password=odoo -d ci --addons-path=/mnt/ideastone-addons,/mnt/openeducat,/usr/lib/python3/dist-packages/odoo/addons --workers=0 --max-cron-threads=0)
          docker run --rm -i --network host --entrypoint odoo "${mounts[@]}" -e FACULTY_QA_PASSWORD odoo:17.0 shell "${odoo_args[@]}" --no-http < docs/qa/faculty-workspace/seed.py
          docker run -d --name faculty-ui-ci --network host --entrypoint odoo "${mounts[@]}" odoo:17.0 "${odoo_args[@]}" --http-port=18069 --db-filter='^ci$'
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:18069/web/login >/dev/null; then break; fi
            sleep 2
          done
          npm install --prefix "$RUNNER_TEMP/faculty-ui-tools" playwright
          "$RUNNER_TEMP/faculty-ui-tools/node_modules/.bin/playwright" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/faculty-ui-tools/node_modules"
          node docs/qa/faculty-workspace/browser.cjs
      - name: Owner lifecycle and UI on disposable Odoo
        shell: bash
        run: |
          set -euo pipefail
          export FACULTY_QA_PASSWORD=$(openssl rand -hex 20)
          export OWNER_QA_OUT="$RUNNER_TEMP/owner-mvp-proof"
          mkdir -p "$OWNER_QA_OUT"
          docker run --rm -i --network host --entrypoint odoo \
            -v faculty-ci-data:/var/lib/odoo \
            -v "$PWD/addons:/mnt/ideastone-addons:ro" \
            -v "$PWD/vendor/openeducat_erp:/mnt/openeducat:ro" \
            -e FACULTY_QA_PASSWORD odoo:17.0 shell \
            --db_host=127.0.0.1 --db_user=odoo --db_password=odoo -d ci \
            --addons-path=/mnt/ideastone-addons,/mnt/openeducat,/usr/lib/python3/dist-packages/odoo/addons \
            --workers=0 --max-cron-threads=0 --no-http < docs/qa/owner-mvp/seed.py
          export NODE_PATH="$RUNNER_TEMP/faculty-ui-tools/node_modules"
          node docs/qa/owner-mvp/browser.cjs
      - name: Student portal workflows and UI on disposable Odoo
        shell: bash
        run: |
          set -euo pipefail
          export STUDENT_QA_PASSWORD=$(openssl rand -hex 20)
          export STUDENT_QA_OUT="$RUNNER_TEMP/student-portal-proof"
          mkdir -p "$STUDENT_QA_OUT"
          docker run --rm -i --network host --entrypoint odoo \
            -v faculty-ci-data:/var/lib/odoo \
            -v "$PWD/addons:/mnt/ideastone-addons:ro" \
            -v "$PWD/vendor/openeducat_erp:/mnt/openeducat:ro" \
            -e STUDENT_QA_PASSWORD odoo:17.0 shell \
            --db_host=127.0.0.1 --db_user=odoo --db_password=odoo -d ci \
            --addons-path=/mnt/ideastone-addons,/mnt/openeducat,/usr/lib/python3/dist-packages/odoo/addons \
            --workers=0 --max-cron-threads=0 --no-http < docs/qa/student-portal/seed.py
          export NODE_PATH="$RUNNER_TEMP/faculty-ui-tools/node_modules"
          node docs/qa/student-portal/browser.cjs
      - name: Upgrade installed campus modules
        shell: bash
        run: |
          set -euo pipefail
          docker stop faculty-ui-ci
          docker run --rm --network host --entrypoint odoo \
            -v faculty-ci-data:/var/lib/odoo \
            -v "$PWD/addons:/mnt/ideastone-addons:ro" \
            -v "$PWD/vendor/openeducat_erp:/mnt/openeducat:ro" \
            odoo:17.0 --db_host=127.0.0.1 --db_user=odoo --db_password=odoo -d ci \
            --addons-path=/mnt/ideastone-addons,/mnt/openeducat,/usr/lib/python3/dist-packages/odoo/addons \
            -u ideastone_campus,ideastone_lms,ideastone_erp --stop-after-init --workers=0 --max-cron-threads=0 2>&1 | tee upgrade.log
          ! grep -E "^[0-9-]+ [0-9:,]+ [0-9]+ (ERROR|CRITICAL)" upgrade.log
      - name: Faculty UI diagnostics and teardown
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/faculty-ui-proof"
          docker logs faculty-ui-ci > "$RUNNER_TEMP/faculty-ui-proof/odoo.log" 2>&1 || true
          docker rm -f faculty-ui-ci || true
          docker volume rm faculty-ci-data || true
      - name: Preserve faculty UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faculty-ui-proof
          path: ${{ runner.temp }}/faculty-ui-proof
          retention-days: 14
      - name: Preserve owner MVP evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-mvp-proof
          path: ${{ runner.temp }}/owner-mvp-proof
          retention-days: 14
      - name: Preserve student portal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-portal-proof
          path: ${{ runner.temp }}/student-portal-proof
          retention-days: 14
      - name: Preserve install and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campus-install-tests
          path: |
            install.log
            upgrade.log
          retention-days: 14

  images:
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: docker/setup-buildx-action@v3
      - name: Build Odoo image
        uses: docker/build-push-action@v6
        with:
          context: ./odoo
          push: false
          tags: ideastone-campus/odoo:ci
          cache-from: type=gha,scope=odoo
          cache-to: type=gha,mode=max,scope=odoo
      - name: Build OpenOlat image
        uses: docker/build-push-action@v6
        with:
          context: ./openolat
          push: false
          tags: ideastone-campus/openolat:ci
          cache-from: type=gha,scope=openolat
          cache-to: type=gha,mode=max,scope=openolat
