# Ideastone Campus — full stack
#   odoo      : Odoo 17 Community + OpenEduCat (ERP: admissions, students, fees, timetable, attendance, exams, library, parents)
#   openolat  : OpenOlat LMS (course content, assessments, SCORM, forums)
#   keycloak  : single sign-on (OpenID Connect) for both
#   db        : one PostgreSQL 16 server, three databases (odoo, openolat, keycloak)
#   nginx     : the ONE entry point — /  = ERP,  /lms/ = LMS,  /sso/ = SSO
#
#   cp .env.example .env   →   docker compose up -d --build   →   http://localhost
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./scripts/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  odoo:
    build: ./odoo
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: ${POSTGRES_USER:-campus}
      PASSWORD: ${POSTGRES_PASSWORD:-campus}
      ODOO_DB: ${ODOO_DB:-campus}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      ODOO_DEMO: ${ODOO_DEMO:-true}
      CAMPUS_AUTO_UPGRADE: ${CAMPUS_AUTO_UPGRADE:-true}
      CAMPUS_PUBLIC_URL: ${CAMPUS_PUBLIC_URL:-http://localhost}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/sso
      LMS_INTERNAL_URL: http://openolat:8088/lms
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo/odoo.conf:/etc/odoo/odoo.conf:ro
      - ./addons:/mnt/ideastone-addons:ro
      - ./vendor/openeducat_erp:/mnt/openeducat:ro
    expose: ["8069", "8072"]
    restart: unless-stopped

  openolat:
    build: ./openolat
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: openolat
      DB_USER: ${POSTGRES_USER:-campus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-campus}
      OLAT_DOMAIN: ${CAMPUS_DOMAIN:-localhost}
      OLAT_PUBLIC_PORT: ${CAMPUS_PORT:-80}
      OLAT_CONTEXT: /lms
    volumes:
      - olat-data:/home/openolat/olatdata
    expose: ["8088"]
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm", "--http-port=8080", "--http-relative-path=/sso", "--proxy-headers=xforwarded"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-campus}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-campus}
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    expose: ["8080"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on: [odoo, openolat, keycloak]
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${CAMPUS_PORT:-80}:80"
    restart: unless-stopped

volumes:
  db-data:
  odoo-data:
  olat-data:
